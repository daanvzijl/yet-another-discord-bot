# Twitch must reach the bot on port 3000 at PUBLIC_HOSTNAME. Postgres is never exposed.
# Optional Cloudflare tunnel: set TUNNEL_TOKEN and COMPOSE_PROFILES=tunnel, and route PUBLIC_HOSTNAME to http://bot:3000.
services:
  bot:
    image: ghcr.io/daanvzijl/yet-another-discord-bot:latest
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD}@db:5432/bot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - bot
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory of /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
